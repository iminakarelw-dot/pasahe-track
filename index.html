<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pasahe Tracker</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="header">
      <h1>Pasahe Tracker</h1>
      <p>Log every tricycle, bao-bao, jeep, van or bus ride. See how much your pasahe costs this month.</p>
    </header>

    <main class="layout">
      <section class="summary" aria-label="Monthly summary"></section>

      <section class="panel" aria-label="Monthly budget">
        <h2>Monthly pasahe budget</h2>
        <div class="budget-form"></div>
      </section>

      <section class="panel" aria-label="Ride form">
        <h2>Ride</h2>
        <div class="ride-form"></div>
      </section>

      <section class="panel panel--wide" aria-label="Ride list">
        <h2>Your rides</h2>
        <div class="ride-list"></div>
      </section>
    </main>

    <script type="module" src="js/controller.js"></script>
  </body>
</html>
